<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Arcade</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121214; color: #ffffff; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #ff4757; font-size: 2.5rem; margin-bottom: 10px; }
        #search { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: none; background: #202024; color: white; font-size: 1rem; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #202024; border-radius: 12px; overflow: hidden; text-align: center; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; color: white; border: 2px solid transparent; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3); border-color: #ff4757; }
        .card img { width: 100%; height: 120px; object-fit: cover; background: #2a2a30; }
        .card p { margin: 10px; font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<header>
    <h1>🎮 School Arcade</h1>
    <input type="text" id="search" placeholder="Spiel suchen..." onkeyup="filterGames()">
</header>

<div class="grid" id="gameGrid">
    <!-- Spiel 1 -->
    <a href="https://hfmanor.com/retro-bowl" class="card" target="_blank">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300" alt="Retro Bowl">
        <p>Retro Bowl</p>
    </a>

    <!-- Spiel 2 -->
    <a href="https://hfmanor.com/subway-surfers" class="card" target="_blank">
        <img src="https://images.unsplash.com/photo-1551103782-8ab07afd45c1?w=300" alt="Subway Surfers">
        <p>Subway Surfers</p>
    </a>

    <!-- Spiel 3 -->
    <a href="https://hfmanor.com/1v1lol" class="card" target="_blank">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=300" alt="1v1.lol">
        <p>1v1.lol</p>
    </a>
    
    <!-- Hier kannst du nach dem gleichen Muster weitere Spiele aus deiner Liste hinzufügen! -->
</div>

<script>
function filterGames() {
    let input = document.getElementById('search').value.toLowerCase();
    let cards = document.getElementsByClassName('card');
    for (let i = 0; i < cards.length; i++) {
        let title = cards[i].getElementsByTagName('p')[0].innerText.toLowerCase();
        cards[i].style.display = title.includes(input) ? "" : "none";
    }
}
</script>

</body>
</html>
